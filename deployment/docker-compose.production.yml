# Runs on the VPS from the app home (/data/planner). The deploy job writes .env next to it.
name: planner

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: planner
    volumes:
      - ${DB_DIR:?}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${IMAGE:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://planner:${POSTGRES_PASSWORD}@db:5432/planner
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      APP_URL: ${APP_URL:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Planner <noreply@example.com>}
      STORAGE_DIR: /data/storage
    volumes:
      - ${MEDIA_DIR:?}:/data/storage
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
